[project]
name = "shadowlab"
version = "0.1.0"
description = "Local-first, evidence-driven application security investigations"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "langgraph>=0.3,<2",
  "langgraph-checkpoint-sqlite>=2,<4", "litellm>=1.60,<2",
  "tree-sitter>=0.24,<0.26", "tree-sitter-typescript>=0.23,<0.24",
  "playwright>=1.50,<2", "semgrep>=1.100,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
shadowlab = "packages.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: requires running trusted demo", "integration: requires external scanner tools"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
